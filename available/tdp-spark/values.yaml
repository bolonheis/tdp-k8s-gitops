# ==============================================================================
# TDP (Tecnisys Data Platform) - Tecnisys
# Helm chart values for Apache Spark
#
# Usage:
# - Edit this file to configure the chart.
# - Prefer placeholders over real secrets; provide secrets via Kubernetes Secret
#   or via Helm --set / external tooling.
# - Keep a single source of truth: values.yaml.
# ==============================================================================

global:
  imagePullSecrets:
    - tdp-registry
  security:
    allowInsecureImages: true

tdp-spark:
  # ServiceAccount used by this wrapper chart templates
  serviceAccount:
    create: true
    name: "tdp-spark-sa"

  # Integration with other TDP components
  integration:
    # JupyterHub integration
    jupyter:
      enabled: false
      sparkConfig:
        "spark.serializer": "org.apache.spark.serializer.KryoSerializer"
        "spark.master": "spark://<spark-master-service>.<namespace>.svc.cluster.local:7077"
        "spark.driver.host": "<spark-driver-host>"
        "spark.driver.port": "2222"
        "spark.driver.bindAddress": "0.0.0.0"
        "spark.blockManager.port": "7777"
        "spark.driver.port.maxRetries": "0"
        "spark.app.id": "jupyter-${JUPYTERHUB_USER}"
        "spark.ui.proxyBase": "/user/${JUPYTERHUB_USER}/proxy/4040"

    # Airflow integration (disabled by default)
    airflow:
      enabled: false
      sparkConfig:
        "spark.master": "spark://spark-master-svc:7077"
        "spark.driver.memory": "1g"
        "spark.executor.memory": "2g"
        "spark.executor.cores": "1"

  # Hadoop configuration - generates core-site.xml ConfigMap
  # This is read by Hadoop BEFORE Spark loads spark-defaults.conf,
  # which is critical for disabling Kerberos and ViewFS.
  hadoopConfig:
    hadoop.security.authentication: "simple"
    hadoop.security.authorization: "false"
    fs.defaultFS: "s3a://warehouse"
    # fs.s3a.endpoint: "<s3a-endpoint>"
    # fs.s3a.access.key: "<s3a-access-key>"
    # fs.s3a.secret.key: "<s3a-secret-key>"
    fs.s3a.path.style.access: "true"
    fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
    fs.s3a.connection.ssl.enabled: "false"
    fs.s3a.region: "us-east-1"
    fs.s3a.connection.maximum: "100"
    fs.s3a.threads.max: "64"
    fs.s3a.fast.upload: "true"
    fs.s3a.block.size: "128M"
    fs.s3a.multipart.size: "104857600"
    # Thread pool and timeout settings as plain numbers (milliseconds)
    # Required because hadoop-aws 3.3.4 cannot parse time suffixes like "60s"
    fs.s3a.connection.establish.timeout: "5000"
    fs.s3a.connection.timeout: "200000"
    fs.s3a.connection.request.timeout: "0"
    fs.s3a.socket.send.buffer: "8192"
    fs.s3a.socket.recv.buffer: "8192"
    fs.s3a.threads.keepalivetime: "60"
    fs.s3a.max.total.tasks: "32"
    fs.s3a.multipart.threshold: "2147483647"
    fs.s3a.multipart.purge.age: "86400"
    fs.s3a.retry.limit: "7"
    fs.s3a.retry.interval: "500"
    fs.s3a.retry.throttle.limit: "20"
    fs.s3a.retry.throttle.interval: "500"
    fs.s3a.readahead.range: "65536"
    fs.s3a.attempts.maximum: "20"
    # Force AWS SDK v1 credential provider (hadoop-aws 3.3.4 doesn't have SDK v2 classes)
    fs.s3a.aws.credentials.provider: "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"

  # Custom spark configuration for the wrapper chart to generate a ConfigMap
  customSparkConfig:
    # ConfigMap that provides spark-defaults.conf mounted by the Bitnami Spark chart
    configMapName: spark-custom-defaults
    # Properties injected into spark-defaults.conf
    properties: |
      # Ensure Ivy local repository uses an absolute, writable path
      spark.jars.ivy /tmp/.ivy2
      # Keep event logs under /tmp which is mounted as an EmptyDir
      spark.eventLog.enabled true
      spark.eventLog.dir file:///tmp/spark-events
      spark.history.fs.logDirectory file:///tmp/spark-events
      # Reverse proxy to allow accessing workers/applications via Master Web UI
      spark.ui.reverseProxy true
      # Hadoop Security - Disable Kerberos (CRITICAL for simple auth)
      spark.hadoop.security.authentication simple
      spark.hadoop.security.authorization false
      spark.hadoop.hadoop.security.authentication simple
      spark.hadoop.hadoop.security.authorization false
      # Disable ViewFS to avoid Kerberos dependency
      spark.hadoop.fs.viewfs.enabled false
      # Set Hadoop user to prevent null user errors
      spark.hadoop.hadoop.user.name spark
      spark.hadoop.hadoop.user.group spark
      # S3 Configuration
      # spark.hadoop.fs.s3a.endpoint <s3a-endpoint>
      # spark.hadoop.fs.s3a.access.key <s3a-access-key>
      # spark.hadoop.fs.s3a.secret.key <s3a-secret-key>
      # spark.hadoop.fs.s3a.path.style.access true
      # spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem
      # spark.hadoop.fs.s3a.connection.ssl.enabled false
      # spark.hadoop.fs.s3a.region us-east-1
      # S3 Performance tuning
      # spark.hadoop.fs.s3a.connection.maximum 100
      # spark.hadoop.fs.s3a.threads.max 64
      # spark.hadoop.fs.s3a.fast.upload true
      # spark.hadoop.fs.s3a.block.size 128M
      # spark.hadoop.fs.s3a.multipart.size 104857600
      # Set default filesystem to S3
      # spark.hadoop.fs.defaultFS s3a://warehouse

  # Optional library dependencies (example used by some integration scenarios)
  extraLibraries: []

  # Optional feature configuration blocks (kept in values.yaml as a single source of truth)
  deltaLake:
    enabled: false
    version: "<delta-version>"
    sparkVersion: "<spark-version>"
    storage:
      type: "s3"
      endpoint: "<s3-endpoint>"
      pathStyleAccess: true
      warehouse: "s3a://warehouse/delta"
    maintenance:
      enabled: false
      schedule: "0 2 * * *"
      operations: []
      vacuum:
        retentionHours: 168
      optimize:
        zOrderEnabled: false

  iceberg:
    enabled: false
    catalog:
      type: "hive"
      uri: "thrift://tdp-hive-metastore.tdp-project.svc.cluster.local:9083"
      warehouse: "s3a://warehouse/hive"
    storage:
      type: "s3"
      endpoint: "<s3-endpoint>"
      pathStyleAccess: true
    maintenance:
      enabled: false
      schedule: "0 2 * * *"
      operations: []

spark:
  enabled: true
  # `commonLabels` is the vendored spark chart's chart-wide label hook. It
  # lands on every resource's own metadata.labels (verified via `helm
  # template`), unlike master.podLabels/worker.podLabels which only reach
  # the pod template. This is where the Tecnisys licensing opt-in
  # (tecnisys.com/licensed, tecnisys.com/product) is applied — see
  # stack/manifests/platform/tdp-platform-license.yaml (one shared whole-platform policy) — requires
  # tdp-license-crds and tdp-license-operator to be installed. Remove the
  # two tecnisys.com/* labels to opt this chart out of enforcement.
  commonLabels:
    tecnisys.io/cluster: "tdp"
    tecnisys.com/licensed: "true"
    tecnisys.com/product: tdp-spark

  serviceAccount:
    create: true
    name: "tdp-spark-sa"

  image:
    registry: registry.tecnisys.com.br
    repository: tdp-dev/images/spark
    tag: 4.0.2-1
    pullPolicy: IfNotPresent
    pullSecrets:
      - tdp-registry

  # Master node configuration with specific resource requirements
  master:
    serviceType: ClusterIP
    configOptions: "-Dspark.ui.reverseProxy=true"
    networkPolicy:
      enabled: false
    resources:
      requests:
        cpu: 1
        memory: 1Gi
      limits:
        cpu: 2
        memory: 2Gi
    # Ensure absolute HOME to avoid Ivy using a relative basedir inside the container
    extraEnvVars:
      - name: HOME
        value: /tmp
      - name: JAVA_TOOL_OPTIONS
        value: "-Duser.home=/tmp -Duser.name=spark"
      - name: HADOOP_USER_NAME
        value: spark
      - name: USER
        value: spark
      - name: SPARK_SUBMIT_OPTS
        value: -Dspark.jars.ivy=/tmp/.ivy2
      - name: HADOOP_CONF_DIR
        value: /opt/bitnami/spark/hadoop-conf
      - name: LD_PRELOAD
        value: /opt/bitnami/common/lib/libnss_wrapper.so
      - name: SPARK_LOCAL_DIRS
        value: /tmp/spark-local
    extraVolumeMounts:
      - name: hadoop-config
        mountPath: /opt/bitnami/spark/hadoop-conf
        readOnly: true
      - name: spark-artifacts
        mountPath: /opt/bitnami/spark/artifacts
    extraVolumes:
      - name: hadoop-config
        configMap:
          name: tdp-spark-hadoop-config
      - name: spark-artifacts
        emptyDir: {}

    securityContext:
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001

    containerSecurityContext:
      readOnlyRootFilesystem: false

    existingConfigmap: "spark-custom-defaults"

    initContainers: []

  # Worker nodes configuration
  worker:
    existingConfigmap: "spark-custom-defaults"
    configOptions: "-Dspark.ui.reverseProxy=true"
    replicaCount: 2
    networkPolicy:
      enabled: false
    resources:
      requests:
        cpu: 1
        memory: 1Gi
      limits:
        cpu: 2
        memory: 4Gi
    # Ensure absolute HOME to avoid Ivy using a relative basedir inside the container
    extraEnvVars:
      - name: HOME
        value: /tmp
      - name: JAVA_TOOL_OPTIONS
        value: "-Duser.home=/tmp -Duser.name=spark"
      - name: HADOOP_USER_NAME
        value: spark
      - name: USER
        value: spark
      - name: SPARK_SUBMIT_OPTS
        value: -Dspark.jars.ivy=/tmp/.ivy2
      - name: HADOOP_CONF_DIR
        value: /opt/bitnami/spark/hadoop-conf
      - name: LD_PRELOAD
        value: /opt/bitnami/common/lib/libnss_wrapper.so
      - name: SPARK_LOCAL_DIRS
        value: /tmp/spark-local
    extraVolumeMounts:
      - name: hadoop-config
        mountPath: /opt/bitnami/spark/hadoop-conf
        readOnly: true
      - name: spark-artifacts
        mountPath: /opt/bitnami/spark/artifacts
    extraVolumes:
      - name: hadoop-config
        configMap:
          name: tdp-spark-hadoop-config
      - name: spark-artifacts
        emptyDir: {}
    # Horizontal Pod Autoscaler configuration for worker nodes
    # When enabled, worker pods will scale automatically based on CPU/memory utilization
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 10
      targetCPU: 70
      targetMemory: 80

  # Spark history server configuration
  historyServer:
    enabled: true
    resources:
      requests:
        cpu: 0.5
        memory: 1Gi
      limits:
        cpu: 1
        memory: 2Gi

  # Essential Spark configurations that differ from defaults
  sparkConf:
    # Executor settings
    "spark.executor.instances": "2"
    "spark.executor.cores": "2"
    "spark.executor.memory": "4g"

    # Driver settings
    "spark.driver.memory": "2g"
    "spark.driver.cores": "1"

    # Event log settings
    "spark.eventLog.enabled": "true"
    "spark.eventLog.dir": "file:///tmp/spark-events"
    "spark.history.fs.logDirectory": "file:///tmp/spark-events"
    "spark.ui.reverseProxy": "true"
    # spark.ui.reverseProxyUrl: "http://spark.tdp.local"  # Set when using Ingress or Gateway API
    
    # Ivy repository
    "spark.jars.ivy": "/tmp/.ivy2"
    
    # Hadoop Security - Disable Kerberos (CRITICAL for simple auth)
    "spark.hadoop.security.authentication": "simple"
    "spark.hadoop.security.authorization": "false"
    "spark.hadoop.hadoop.security.authentication": "simple"
    "spark.hadoop.hadoop.security.authorization": "false"
    
    # Disable ViewFS to avoid Kerberos dependency
    "spark.hadoop.fs.viewfs.enabled": "false"
    
    # Set Hadoop user to prevent null user errors
    "spark.hadoop.hadoop.user.name": "spark"
    "spark.hadoop.hadoop.user.group": "spark"
    
    # S3A Configuration
    # "spark.hadoop.fs.s3a.endpoint": "<s3a-endpoint>"
    # "spark.hadoop.fs.s3a.access.key": "<s3a-access-key>"
    # "spark.hadoop.fs.s3a.secret.key": "<s3a-secret-key>"
    # "spark.hadoop.fs.s3a.path.style.access": "true"
    # "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    # "spark.hadoop.fs.s3a.connection.ssl.enabled": "false"
    # "spark.hadoop.fs.s3a.region": "us-east-1"
    
    # S3 Performance tuning
    "spark.hadoop.fs.s3a.connection.maximum": "100"
    "spark.hadoop.fs.s3a.threads.max": "64"
    "spark.hadoop.fs.s3a.fast.upload": "true"
    "spark.hadoop.fs.s3a.block.size": "128M"
    "spark.hadoop.fs.s3a.multipart.size": "104857600"
    
    # Set default filesystem to S3
    "spark.hadoop.fs.defaultFS": "s3a://warehouse"

  # Environment variables for Spark
  environment:
    SPARK_WORKER_MEMORY: "4g"
    SPARK_WORKER_CORES: "2"

  # Storage configuration for persistent data
  storage:
    persistentVolume:
      enabled: true
      size: 10Gi
      storageClass: "standard"

    # Configuration for shared storage
    shared:
      enabled: true
      mountPath: "/shared-data"
      persistentVolume:
        size: 20Gi
        storageClass: "standard"
        accessModes:
          - ReadWriteMany

# ==============================================================================
# TDP Gateway & Gateway API defaults
# ==============================================================================
gatewayApi:
  parentRefs: []
  spark:
    enabled: false
    hostnames:
      - spark.tdp.local
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - name: ""
            port: 80
    tls:
      certificateRefs: []

TDP-Settings:
  gateway:
    ingress:
      enabled: false
    gatewayApi:
      enabled: false

